# Thin caller: build, vet, lint, coverage gate and the drift gates live in the toolkit.
name: ci
# A correction pull request carries one JSON file under spec/corrections/;
# it cannot change generated code, so the build, lint and drift gates have
# nothing to measure. paths-ignore skips the run only when every changed
# file is one of these — a mixed change still runs.
on:
  push:
    branches: [main]
    paths-ignore: &decisions
      - 'spec/corrections/**'
      - 'audit/observations/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore: *decisions
permissions:
  contents: read
jobs:
  ci:
    uses: deploymenttheory/terraform-plugin-framework-codegen-1/.github/workflows/30-ci.yml@v0
