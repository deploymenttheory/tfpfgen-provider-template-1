# tfpfgen.yaml — the one authored config file of this provider repo.
# Schema reference: docs/config.md in the toolkit
# (deploymenttheory/terraform-plugin-framework-codegen-1); docs/CONFIGURING.md
# here walks each decision. Replace every FILL_ME — `tfpfgen config validate`,
# the pipeline's first job, rejects each one by name until it is real.

version: 1 # schema version of this file; must equal the installed toolkit's

provider:
  name: FILL_ME # provider name as published to the registry; a lowercase DNS label
  registry_namespace: FILL_ME # registry namespace the provider is published under; a lowercase DNS label

generator:
  version: FILL_ME # exact toolkit release tag (vX.Y.Z) the pipeline installs; branches are refused

spec:
  document_url: FILL_ME # http(s) URL of the upstream OpenAPI document that `tfpfgen spec import` pins by hash

sdk:
  backend: FILL_ME # SDK generator behind the common interface: kiota | openapi-generator
  backend_version: "" # exact version pin of the backend tool to install; must not be empty
  # client_type_name: APIClient # Go type name of the generated SDK client
  # include_paths: [] # spec paths to include in SDK generation; empty means every path
  # exclude_paths: [] # spec paths to exclude from SDK generation

auth:
  method: FILL_ME # how the audit authenticates: bearer_token | api_key_header | basic | oauth2_client_credentials | github_app
  # api_key_header: "" # header name the API key is sent in; required by and only meaningful for api_key_header
  # token_url: "" # OAuth2 token endpoint; required when the method is oauth2_client_credentials

# audit:
#   enabled: true # whether the credentialed live-API audit stage runs at all
#   base_url_override: "" # base URL the audit calls instead of the server named in the spec
#   name_prefix: tfpfgen # prefix every live object the audit creates carries; cleanup matches on it
#   max_objects: 25 # budget of live objects one audit run may create
#   rate_limit_rps: 2 # requests per second the audit may send to the live API
#   auto_accept: [] # correction categories folded in by `tfpfgen spec revise` without waiting for a human

# services:
#   exclude: [] # spec entities that become no provider code
